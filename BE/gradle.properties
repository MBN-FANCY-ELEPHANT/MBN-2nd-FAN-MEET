# ⚠️ org.gradle.jvmargs 에 -Dfile.encoding 을 넣지 마세요.
#    프로젝트 경로에 한글/공백("바탕 화면", "MBN해커톤")이 있으면 테스트 워커의
#    클래스패스 해석이 깨져 ClassNotFoundException 이 발생합니다.
#    소스 인코딩은 build.gradle 의 JavaCompile.options.encoding,
#    SQL 시드 인코딩은 application.yml 의 spring.sql.init.encoding 으로 처리합니다.
org.gradle.jvmargs=-Xmx2g
org.gradle.caching=true
org.gradle.parallel=true
