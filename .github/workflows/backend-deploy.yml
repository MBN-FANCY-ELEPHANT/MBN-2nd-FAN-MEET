name: Backend Deploy

on:
  pull_request:
    paths:
      - 'BE/**'
      - '.github/workflows/backend-deploy.yml'
  push:
    branches: [main]
    paths:
      - 'BE/**'
      - '.github/workflows/backend-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-prod
  cancel-in-progress: false

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BE
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - run: chmod +x ./gradlew

      - name: Test and build Backend
        run: ./gradlew clean build --no-daemon

      - name: Validate production Docker image
        run: docker build --tag trot-fandom-backend:ci .

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-deploy-test-report
          path: BE/build/reports/tests/test

  deploy:
    # workflow_dispatch는 검증된 긴급 배포 브랜치에서도 production 승인을 거쳐 실행합니다.
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    needs: build-test
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY_NAME: ${{ vars.ECR_REPOSITORY_NAME }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      SSM_PARAMETER_PREFIX: ${{ vars.SSM_PARAMETER_PREFIX }}
      BACKEND_HEALTH_URL: ${{ vars.BACKEND_HEALTH_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to AWS with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push immutable image
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY_NAME:$GITHUB_SHA"
          docker build --tag "$IMAGE_URI" BE
          docker push "$IMAGE_URI"
          echo "IMAGE_URI=$IMAGE_URI" >> "$GITHUB_ENV"

      - name: Deploy through SSM with rollback
        id: deploy
        run: |
          COMMAND="sudo /usr/local/bin/deploy-trot-backend '$IMAGE_URI' '$AWS_REGION' '$SSM_PARAMETER_PREFIX'"
          PARAMETERS=$(jq -n --arg command "$COMMAND" '{commands: [$command]}')
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters "$PARAMETERS" \
            --query 'Command.CommandId' \
            --output text)

          set +e
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID"
          WAIT_EXIT=$?
          set -e

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}'

          if [ "$WAIT_EXIT" -ne 0 ]; then
            exit "$WAIT_EXIT"
          fi

      - name: Verify public health endpoint
        run: |
          for attempt in $(seq 1 12); do
            if curl --fail --silent "$BACKEND_HEALTH_URL" | grep -q '"status":"UP"'; then
              exit 0
            fi
            sleep 5
          done
          echo "Backend health check failed: $BACKEND_HEALTH_URL" >&2
          exit 1
